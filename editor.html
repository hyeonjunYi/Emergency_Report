<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>현장보고 작성 | 현장대응단</title>
  <link rel="stylesheet" href="editor.css">
  <style>
    header .wrap { min-height: 48px; padding: 6px 16px; display: flex; align-items: center; justify-content: space-between; }
    header b { font-size: 16px; margin: 0; }
    .btn-sm { min-height: 32px !important; padding: 4px 10px !important; font-size: 13px !important; border-radius: 4px; }
    .type-selector { display: flex; gap: 8px; margin: 12px 0 16px; background: var(--canvas); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); align-items: center; }
    .type-selector label { font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0; }
    .actions button { min-height: 38px; padding: 6px 12px; font-size: 14px; flex: 1 1 auto; }
    .hidden-field { display: none !important; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header>
    <div class="wrap" style="width: 100%;">
      <b>계룡소방서 현장대응단</b>
    </div>
  </header>
  <main id="main" style="padding: 12px 16px;">
    <h2 class="page-title" style="font-size: 22px; margin: 10px 0 6px;">현장보고 작성</h2>
    
    <!-- 화재 / 오인신고 전환 버튼 -->
    <div class="type-selector" style="display:flex; gap:10px; margin:12px 0 16px; background:var(--canvas); padding:10px 14px; border-radius:8px; border:1px solid var(--border); align-items:center;">
      <span style="font-size:14px; color:var(--fg2); font-weight:600; white-space:nowrap;">보고 구분:</span>
      <div style="display:flex; gap:8px; flex:1;">
        <button type="button" id="btnTypeFire" style="flex:1; min-height:38px; font-weight:700; font-size:14px; border-radius:6px; cursor:pointer; border:1px solid var(--primary); background:var(--primary); color:#fff;">🔥 화재</button>
        <button type="button" id="btnTypeFalse" style="flex:1; min-height:38px; font-weight:700; font-size:14px; border-radius:6px; cursor:pointer; border:1px solid var(--border); background:var(--muted); color:var(--fg);">🚨 오인신고</button>
      </div>
      <input type="hidden" id="reportTypeVal" value="fire">
    </div>

    <!-- 연동 버튼이 백업/불러오기 다음에 위치하도록 배치 -->
    <div class="tools" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;">
      <button id="new" type="button" class="btn-sm">새 사건 시작</button>
      <button id="sample" type="button" class="btn-sm">기본 서식 불러오기</button>
      <button id="backup" type="button" class="btn-sm">백업(.json)</button>
      <label class="button btn-sm">불러오기<input id="restore" type="file" accept="application/json,.json" hidden></label>
      <button id="ghConfigBtn" type="button" class="btn-sm" style="border-color:var(--primary);color:var(--primary);font-weight:600">⚙️ 연동설정</button>
    </div>

    <form id="form">
      <div id="fields"></div>

      <section style="margin: 20px 0; padding: 16px;">
        <h3 style="font-size: 16px; margin: 0 0 8px;">현장기록사진 (최대 8장)</h3>
        <label class="button primary btn-sm">사진 선택<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></label>
        <div id="photos" style="margin-top: 10px;"></div>
      </section>

      <!-- 개인정보 노출여부 확인 섹션 제거 완료 -->

      <div class="actions">
        <button id="preview" type="button" class="primary">미리보기</button>
        <button id="publishGh" type="button" class="primary" style="background:#0F7B3D; border-color:#0F7B3D;">GitHub 즉시배포</button>
        <button id="export" type="button">HTML 저장</button>
      </div>

      <div id="downloads"></div>
      <p id="message" role="status" aria-live="polite" style="font-size:13px; color:var(--link);"></p>
    </form>

    <section id="previewArea" hidden>
      <div class="tools" style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size:16px; margin:0;">미리보기 화면</h3>
        <button id="close" type="button" class="btn-sm">닫기</button>
      </div>
      <iframe id="previewFrame" title="보고서 미리보기" sandbox="allow-scripts allow-modals" style="width:100%; height:450px; border:1px solid var(--border); border-radius:8px; margin-top:8px;"></iframe>
    </section>

    <!-- GitHub 연동 팝업 -->
    <div id="ghModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:99999;justify-content:center;align-items:center">
      <div style="background:var(--canvas,#fff);color:var(--fg,#131416);border:1px solid var(--border,#ccc);border-radius:10px;padding:18px;max-width:440px;width:90%;">
        <h3 style="margin-top:0; font-size:17px;">GitHub 자동배포 설정</h3>
        <div style="display:flex;flex-direction:column;gap:10px;margin:12px 0;">
          <label style="font-size:13px;">저장소 (소유자/레포명)<input id="ghRepo" placeholder="hyeonjunyi/Emergency_Report" style="width:100%;min-height:36px;"></label>
          <label style="font-size:13px;">브랜치<input id="ghBranch" value="main" style="width:100%;min-height:36px;"></label>
          <label style="font-size:13px;">Personal Access Token<input id="ghToken" type="password" placeholder="ghp_xxx" style="width:100%;min-height:36px;"></label>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:6px;">
          <button id="ghSaveBtn" type="button" class="primary btn-sm">저장</button>
          <button id="ghCloseBtn" type="button" class="btn-sm">닫기</button>
        </div>
      </div>
    </div>
  </main>
  <script src="report.js"></script>
  <script src="editor.js"></script>
</body>
</html>
