`<div class="agency-note"><strong>유관기관 공동대응</strong><p>${e('agency')}</p></div>`:''}</section><div class="report-grid"><section class="panel"><p class="eyebrow">02 · 대상 상세정보</p><h3>화재 대상</h3><dl>${pair('발생장소','address')}${pair('화재대상','target')}${pair('대상정보','vehicle')}${pair('유관기관','agency')}</dl></section><section class="panel"><p class="eyebrow">03 · 현장 확인</p><h3>초기 현장상황</h3><p class="situation" style="white-space:pre-wrap">${e('situation')}</p><div class="check-note"><strong>추가 확인사항</strong><p style="white-space:pre-wrap">${e('checks')}</p></div></section></div><section class="panel damage-panel"><p class="eyebrow">피해 및 조사</p><h3>피해 및 조사현황</h3><div class="investigation-grid">${cell('인명피해','injury')}${cell('대상 피해','damage')}${cell('재산피해액','loss')}${cell('발화지점','origin')}${cell('화재원인','cause')}<div><small>초진 / 완진</small><strong>${e('knockdown')} / ${e('out')}</strong></div></div><p class="source-note">현장 확인 및 조사 진행에 따라 보완 예정.</p></section><section class="panel timeline-panel"><p class="eyebrow">04 · 대응 경과</p><h3>상황 경과</h3><ol class="timeline">${[['received','신고 접수'],['dispatch','출동 지령'],['arrival','선착대 도착'],['commander_arrival','지휘팀 도착'],['knockdown','초진'],['out','완진']].map(([k,t])=>`<li><time>${e(k)}</time><strong>${t}</strong></li>`).join('')}</ol></section>${photos.length>1?`<section class="photo-strip">${photos.slice(1).map(p=>`<figure><img src="${esc(p.src)}" alt="${esc(p.caption)}"><figcaption>${esc(p.caption)}</figcaption></figure>`).join('')}</section>`:''}<footer><div class="signoff"><b>${e('unit')}</b><span class="author-info"><strong>작성자 · ${e('author')}</strong> <a href="tel:${e('phone')}" class="phone-link">📞 ${e('phone')}</a></span></div><p>화재조사 초기 현장상황보고 · 보고 기준 ${e('updated')}</p></footer></main>`;

function setupContrast(){const b=document.querySelector('[data-contrast]');if(!b)return;let active=false;try{active=localStorage.getItem('field-contrast')==='yes'}catch{}function apply(){document.documentElement.classList.toggle('high-contrast',active);b.textContent=active?'기본 화면':'선명한 화면';b.setAttribute('aria-pressed',String(active))}apply();b.onclick=()=>{active=!active;apply();try{localStorage.setItem('field-contrast',active?'yes':'no')}catch{}}}
